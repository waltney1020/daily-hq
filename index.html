<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071A20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daily HQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="amb" id="ambA" aria-hidden="true"></div><div class="amb b" id="ambB" aria-hidden="true"></div><div class="amb-shade" aria-hidden="true"></div>

<div class="app">
  <header class="mast">
    <div class="brand">Daily HQ <span>/</span> <b id="crumb">Home</b></div>
    <div class="mid"><div class="time" id="time"></div><div class="dt" id="dt"></div></div>
    <div class="acts">
      <button class="write" id="logbtn">Log a trade</button>
      <button class="ic" id="setbtn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <div class="strip" id="strip">
    <div class="week" id="week" aria-label="This week"></div>
    <div class="sys">
      <button class="sysc" id="streakbtn" aria-label="Streak"><svg viewBox="0 0 24 24"><path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-2 1-3 1.5-4 .5 1.5 1.5 2 1.5 2S10 6 12 3z"/></svg><span class="lbl" id="streaklbl">0 days</span></button>
      <button class="sysc" id="syncbtn" aria-label="Sync Polymarket"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg><span class="dot" id="syncdot" hidden></span></button>
    </div>
  </div>

  <main id="v-home">
    <section class="theatre" id="theatre">
      <div class="atmo" id="atmo"></div>
      <button class="feedon" id="levelpill"></button>
      <div class="rail" id="rail"></div>
      <button class="arrow l" id="prev" aria-label="Previous card"><svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg></button>
      <button class="arrow r" id="next" aria-label="Next card"><svg viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></svg></button>
    </section>
  </main>

  <section class="page" id="p-today">
    <div class="panel donext">
      <div class="row sb"><div class="row"><span class="eyebrow ink">Do next</span><span class="chip" id="dncount"></span></div><span class="sub" id="dnxp"></span></div>
      <div class="h1" id="dnt"></div>
      <p class="sub" id="dnsub"></p>
      <div class="row" style="margin-top:16px"><button class="action p" id="dndone">Done →</button><button class="action" id="dnskip">Later</button></div>
    </div>
    <div class="panel">
      <div class="row sb"><div><div class="ptitle">Your plan for today</div><div class="sub">Routine repeats every day. Today-only tasks clear at midnight.</div></div><span class="chip" id="prog"></span></div>
      <div id="tasks"></div>
      <form class="add" id="addf"><input id="nt" placeholder="Pick up groceries" aria-label="New task" autocomplete="off"><select id="rep" aria-label="Repeat"><option value="once">Today only</option><option value="daily">Every day</option><option value="weekly">Every week on this day</option></select><button class="action p">Add</button></form>
    </div>
  </section>

  <section class="page" id="p-trades">
    <div class="row sb">
      <div class="seg" id="acct"><span class="hl"></span><button data-a="poly">Polymarket</button><button data-a="manual">Manual</button><button data-a="bob">Bob</button></div>
      <div class="row syncline" id="syncline"></div>
    </div>
    <div class="grid">
      <div class="panel col2 balpanel">
        <div class="row sb"><span class="eyebrow">Balance</span><div class="seg" id="tf"><span class="hl"></span><button data-t="5m">5m</button><button data-t="15m">15m</button><button data-t="1h">1h</button><button data-t="All">All</button></div></div>
        <div class="big" id="bal">$0.00</div>
        <div class="row"><span class="chip" id="todaypnl"></span><span class="chip" id="allpnl"></span><span class="chip" id="openchip" hidden></span></div>
        <svg class="spark" id="spark" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
      <div class="panel quick">
        <span class="eyebrow" id="quicklabel">Quick log</span>
        <button class="action w big-btn" id="won">+ Won</button>
        <button class="action l big-btn" id="lost">+ Lost</button>
        <div class="stats"><div class="stat"><small>Win rate</small><b id="wr">–</b></div><div class="stat"><small>Score</small><b id="rec">0–0</b></div><div class="stat"><small>Streak</small><b id="tstreak">–</b></div><div class="stat"><small>Trades</small><b id="tcount">0</b></div></div>
      </div>
    </div>
    <div class="panel"><div class="row sb"><span class="ptitle">Trades</span><button class="link" id="addtrade">+ Add with details</button></div><div id="log"></div></div>
  </section>

  <section class="page" id="p-food">
    <div class="row sb">
      <div class="seg" id="who"><span class="hl"></span><button data-w="me">For me</button><button data-w="dog">For the dogs</button></div>
      <button class="action p" id="newrecipe">+ New recipe</button>
    </div>
    <div class="panel foodtop">
      <input id="fsearch" class="fsearch" type="search" placeholder="Search recipes or ingredients" aria-label="Search recipes" autocomplete="off">
      <div class="chips" id="fcats"></div>
    </div>
    <div id="dogsafe"></div>
    <div class="recipes" id="recipes"></div>
  </section>

  <section class="page" id="p-journal">
    <div class="books" id="books"></div>
    <div class="panel jbody" id="jpanel"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<div class="orbit" id="orbit" aria-hidden="true">
  <span class="disc d0"></span><span class="disc d1"></span><span class="disc d2"></span><span class="disc d3"></span>
  <button class="olab ol0" data-a="won">Log a win</button>
  <button class="olab ol1" data-a="lost">Log a loss</button>
  <button class="olab ol2" data-a="task">Add a task</button>
  <button class="olab ol3" data-a="entry">Journal</button>
</div>

<nav class="dock" id="dock" aria-label="Sections">
  <button class="db" data-k="apps" aria-label="Shortcuts"><svg viewBox="0 0 24 24"><path d="M7 7h.01M12 7h.01M17 7h.01M7 12h.01M12 12h.01M17 12h.01M7 17h.01M12 17h.01M17 17h.01" stroke-width="3"/></svg><span class="tip">Shortcuts</span></button>
  <span class="vsep"></span>
  <div class="stage">
    <div class="dcore" id="dcore">
      <button class="db on" data-v="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span class="tip">Home</span></button>
      <button class="db" data-v="today" aria-label="Today"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span class="badge" id="dbadge" hidden></span><span class="tip">Today</span></button>
      <button class="db" data-v="trades" aria-label="Trades"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7 15l4-4 3 3 6-6"/></svg><span class="tip">Trades</span></button>
      <button class="db" data-v="journal" aria-label="Journal"><svg viewBox="0 0 24 24"><path d="M6 4h11a1 1 0 0 1 1 1v15H7a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1zM5 18a2 2 0 0 1 2-2h11M9 8h6"/></svg><span class="tip">Journal</span></button>
      <button class="db" data-v="food" aria-label="Food"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M16 21V3c-2 1.5-3 4-3 7s1 4 3 4"/></svg><span class="tip">Food</span></button>
      <span class="glide" id="glide"></span>
    </div>
    <div class="dapps">
      <button class="db" data-k="back" aria-label="Back" style="--i:0"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="tip">Back</span></button>
      <a class="db" href="https://polymarket.com/crypto/5M" target="_blank" rel="noopener" style="--i:1"><span class="tile" style="background:#2E5BFF;color:#fff">PM</span><span class="tip">Polymarket</span></a>
      <a class="db" href="https://www.tradingview.com/chart/?symbol=BTCUSD" target="_blank" rel="noopener" style="--i:2"><span class="tile" style="background:#131722;color:#fff">TV</span><span class="tip">BTC chart</span></a>
      <a class="db" href="https://calendar.google.com" target="_blank" rel="noopener" style="--i:3"><span class="tile" style="background:#fff;color:#1A73E8">31</span><span class="tip">Calendar</span></a>
      <a class="db" href="https://www.youtube.com" target="_blank" rel="noopener" style="--i:4"><span class="tile" style="background:#FF0033;color:#fff">▶</span><span class="tip">YouTube</span></a>
    </div>
  </div>
  <span class="vsep"></span>
  <button class="db assist" id="assist" aria-label="Quick add"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8z"/></svg><span class="tip">Quick add</span></button>
</nav>

<div class="sheetwrap" id="sheetwrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>

<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
