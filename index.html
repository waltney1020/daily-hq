<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071A20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Op-Lock In</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500&display=swap">
<link rel="stylesheet" href="app.css?v=53">
</head>
<body>
<div class="amb" id="ambA" aria-hidden="true"></div><div class="amb b" id="ambB" aria-hidden="true"></div><div class="amb-shade" aria-hidden="true"></div><div class="room" id="room" aria-hidden="true"></div>

<div class="app">
  <header class="hd">
    <div class="hd-top">
      <div class="greet"><small><span id="dt"></span> · <span id="time"></span></small><b id="greet">Good morning, James</b><span id="crumb" hidden></span></div>
      <button class="ic" id="setbtn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
    <div class="hchips">
      <button class="hchip" id="waterbtn" aria-label="Water">💧 <span id="waterlbl">0 L</span><span class="dot" id="waterdot" hidden></span></button>
      <button class="hchip" id="streakbtn" aria-label="Streak">🔥 <span id="streaklbl">0 days</span></button>
      <button class="hchip" id="donebtn" aria-label="Today's progress"><span id="donelbl">0 of 0 done</span></button>
      <button id="syncbtn" hidden></button><span id="syncdot" hidden></span><button id="logbtn" hidden></button>
    </div>
    <div class="strip" id="strip"><div class="week" id="week" aria-label="This week"></div><div class="stripchips" id="stripchips"></div></div>
  </header>

  <main id="v-home">
    <section class="theatre" id="theatre">
      <div class="atmo" id="atmo"></div>
      <button class="feedon" id="levelpill"></button>
      <div class="rail" id="rail"></div>
      <button class="arrow l" id="prev" aria-label="Previous card"><svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg></button>
      <button class="arrow r" id="next" aria-label="Next card"><svg viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></svg></button>
    </section>
  </main>

  <section class="page" id="p-today">
    <div class="foodbar" id="foodbar" role="button" tabindex="0" aria-label="Food: open your food and the dogs"></div>
    <div class="wnote fnote" id="fnote" hidden role="note"></div>
    <div class="tdhead">
      <div><div class="tdtitle" id="tdtitle">Today</div><div class="tdmeta"><span id="prog"></span> done · <span id="dnxp"></span></div></div>
      <button class="ic" id="alertsbtn" aria-label="Reminders"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></svg></button>
    </div>
    <div class="glasses" id="watercard"></div>
    <div class="wnote" id="wnote" hidden role="note"></div>
    <div class="donext" id="donext">
      <div class="row sb"><span class="eyebrow" id="dncount"></span></div>
      <div class="dnt" id="dnt"></div>
      <p class="dnsub" id="dnsub"></p>
      <div class="slide" id="dndone"><span class="slidefill"></span><span class="slidetxt">Slide to mark done</span><button class="knob" id="dnknob" aria-label="Mark done"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
      <button class="dnlater" id="dnskip">Later</button>
    </div>
    <div class="tlwrap">
      <div class="tline" id="tasks"></div>
      <form class="add" id="addf"><input id="nt" placeholder="Pick up groceries" aria-label="New task" autocomplete="off"><select id="rep" aria-label="Repeat"><option value="once">Today only</option><option value="daily">Every day</option><option value="weekly">Every week on this day</option></select><button class="action p">Add</button></form>
    </div>
  </section>

  <section class="page" id="p-trades">
    <div class="txtop"><div><span class="eyebrow">All sections</span><div class="txh1">Today <span id="txtoday" class="num"></span></div></div></div>
    <div class="txcards" id="txcards" role="tablist" aria-label="Trading sections"></div>
    <div class="txdots" id="txdots" aria-hidden="true"></div>
    <div id="txbody"></div>
  </section>

  <section class="page" id="p-food">
    <div class="row sb">
      <div class="seg" id="who"><span class="hl"></span><button data-w="me">For me</button><button data-w="dog">For the dogs</button></div>
      <button class="action p" id="newrecipe">+ New recipe</button>
    </div>
    <div class="panel foodtop">
      <input id="fsearch" class="fsearch" type="search" placeholder="Search recipes or ingredients" aria-label="Search recipes" autocomplete="off">
      <div class="chips" id="fcats"></div>
    </div>
    <div id="dogsafe"></div>
    <div class="recipes" id="recipes"></div>
  </section>

  <section class="page" id="p-smoke">
    <button class="calmbtn" id="calmbtn"><span>I'm about to smoke</span><b>but I don't want to</b><i>Tap for 2 minutes of calm first</i></button>
    <div class="grid">
      <div class="panel col2" id="smokesession"></div>
      <div class="panel" id="smokestats"></div>
    </div>
    <div class="panel" id="smokelog"></div>
  </section>

  <section class="page" id="p-money">
    <div class="msum" id="moneysum"></div>
    <div class="mtabs" id="mtabs" role="tablist" aria-label="Money views"><span class="hl" id="mtabhl"></span><button role="tab" data-mt="log">Log</button><button role="tab" data-mt="ov">Overview</button><button role="tab" data-mt="buy">To buy</button><button role="tab" data-mt="hist">History</button></div>
    <div class="mview" id="mv-log"><div class="mlog" id="moneyadd"></div></div>
    <div class="mview" id="mv-ov">
      <div class="mcard">
        <div class="mchead"><b id="mctitle">Daily spending</b><div class="mseg" id="mcview"><button data-v="days">Days</button><button data-v="split">Split</button><button data-v="months">Months</button></div></div>
        <div class="mcwrap" id="mcwrap"><svg id="mchart" role="img" aria-label="Spending chart"></svg><div class="mtip" id="mtip"></div></div>
        <div class="mcap" id="mccap"></div>
        <div class="mlegend" id="mlegend"></div>
        <button class="mtblbtn" id="mtblbtn">Show as table</button><div id="mtbl" hidden></div>
      </div>
      <div class="mcard" id="moneycats"></div>
    </div>
    <div class="mview" id="mv-buy"><div id="moneywish"></div></div>
    <div class="mview" id="mv-hist"><div id="moneylog"></div></div>
  </section>

  <section class="page" id="p-journal">
    <div class="books" id="books"></div>
    <div class="panel jbody" id="jpanel"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<div class="orbit" id="orbit" aria-hidden="true">
  <span class="disc d0"></span><span class="disc d1"></span><span class="disc d2"></span><span class="disc d3"></span>
  <button class="olab ol0" data-a="won">Log a win</button>
  <button class="olab ol1" data-a="lost">Log a loss</button>
  <button class="olab ol2" data-a="task">Add a task</button>
  <button class="olab ol3" data-a="entry">Journal</button>
</div>

<div class="qorbit" id="qlog" aria-hidden="true">
  <div class="qscrim" id="qscrim"></div>
  <div class="qo">
    <span class="disc q0"></span><span class="disc q1"></span><span class="disc q2"></span><span class="disc q3"></span><span class="disc q4"></span>
    <button class="qlab ql0" data-q="trade">📈 Log a trade</button>
    <button class="qlab ql1" data-q="purchase">$ Purchase</button>
    <button class="qlab ql2" data-q="water">💧 +500 ml water</button>
    <button class="qlab ql3" data-q="task">✓ Add a task</button>
    <button class="qlab ql4" data-q="puff">🚬 Log a puff</button>
  </div>
</div>
<nav class="tabbar" id="dock" aria-label="Sections">
  <button class="tb" data-v="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Home</span></button>
  <button class="tb" data-v="today"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>Today</span><i class="badge" id="dbadge" hidden></i></button>
  <button class="tplus" id="plusbtn" aria-label="Quick log" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tb" data-v="money"><svg viewBox="0 0 24 24"><path d="M3 7h18v10H3zM3 10h18M7 14h3"/></svg><span>Money</span></button>
  <button class="tb" data-k="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>More</span></button>
</nav>

<div class="troom" id="troom" role="dialog" aria-modal="true" aria-label="Task"><canvas id="trcv" aria-hidden="true"></canvas><div class="trfade" aria-hidden="true"></div><div class="trs" id="trs"></div><div class="trfoot" id="trfoot"></div><div class="trcele" aria-live="polite"><div><div class="trck">✓</div><b>Done</b><span>+10 XP</span></div></div></div>
<div class="calm" id="calm" hidden aria-modal="true" role="dialog" aria-label="Calm mode"><canvas id="calmcv" aria-hidden="true"></canvas><div class="calm-in" id="calmin"></div></div>
<div class="sheetwrap" id="sheetwrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
<script src="art.js?v=53"></script>
<script src="app.js?v=53"></script>
</body>
</html>
